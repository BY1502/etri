apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: label-studio-data
  namespace: kubeflow
  labels:
    app: label-studio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-studio
  namespace: kubeflow
  labels:
    app: label-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: label-studio
  template:
    metadata:
      labels:
        app: label-studio
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1001
      containers:
        - name: label-studio
          image: localhost:5000/label-studio@sha256:20cec817e63144adec9f23d699bf4f33ce4249a56eb183ae4853d20fbd10fd93
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LABEL_STUDIO_HOST
              value: "https://192.168.0.166:30443/label-studio"
            - name: LABEL_STUDIO_PORT
              value: "8080"
            - name: LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED
              value: "true"
            - name: LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT
              value: "/label-studio/data"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://192.168.0.166:30443"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /label-studio/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: label-studio-data
---
apiVersion: v1
kind: Service
metadata:
  name: label-studio
  namespace: kubeflow
  labels:
    app: label-studio
spec:
  selector:
    app: label-studio
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: label-studio
  namespace: kubeflow
spec:
  gateways:
    - kubeflow/kubeflow-gateway
  hosts:
    - "*"
  http:
    - match:
        - uri:
            prefix: /label-studio/
      headers:
        request:
          add:
            x-forwarded-prefix: /label-studio
            x-forwarded-proto: https
      rewrite:
        uri: /
      route:
        - destination:
            host: label-studio.kubeflow.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            exact: /label-studio
      redirect:
        uri: /label-studio/
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: label-studio
  namespace: kubeflow
spec:
  podSelector:
    matchLabels:
      app: label-studio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - podSelector: {}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: label-studio-allow
  namespace: kubeflow
spec:
  selector:
    matchLabels:
      app: label-studio
  rules:
    - {}
